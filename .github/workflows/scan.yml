name: Breakout Scan

on:
  schedule:
    # Every 5 minutes, hours 3-10 UTC (covers 8:30 AM-3:30 PM IST with some
    # margin either side), Monday-Friday. The script itself checks market
    # hours precisely and exits immediately outside them, so the margin
    # here just means a few cheap no-op runs, not extra scanning.
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scan.py

      - name: Commit updated cache/state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f fno_universe_cache.json alerted_signals.json
          git diff --staged --quiet || git commit -m "Update scan state [skip ci]"
          git push